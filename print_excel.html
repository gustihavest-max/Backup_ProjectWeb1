<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cetak E-Perjadin</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="print_excel.css">
</head>
<body class="bg-cover bg-center bg-fixed" style="background-image: url('img/bg_perjadin.jpg');">

  <!-- NAVBAR -->
  <header class="navbar flex justify-between items-center p-4 bg-white bg-opacity-80 shadow-md">
    <div class="flex items-center gap-3">
      <img src="img/Logo-Kementan.png" alt="Logo Kementan" class="h-12">
      <a href="https://perkebunan.brmp.pertanian.go.id/" class="navbar-title text-lg font-bold" target="_blank">
        BRMP PERKEBUNAN
      </a>
    </div>
    <nav class="flex items-center gap-4">
      <span id="userDisplay" class="font-semibold"></span>
      <a href="dashboard.html" class="dashboard-btn text-white bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded transition">⬅️ Dashboard</a>
    </nav>
  </header>

  <!-- HEADER PAGE -->
  <div class="page-header text-center py-8">
    <h1 class="text-2xl font-bold">📋 Cetak Surat Tugas dan Permohonan Perjalanan Dinas</h1>
    <p>Klik tombol "Cetak Excel" pada baris yang ingin dicetak.</p>
  </div>

  <div id="loader" class="loader text-center py-10">Memuat data...</div>

  <!-- TABEL DATA -->
  <div id="tabelContainer" class="hidden px-4">
    <div class="table-wrapper overflow-x-auto">
      <table class="min-w-full border-collapse shadow-lg bg-white bg-opacity-90">
        <thead class="bg-blue-700 text-white">
          <tr>
            <th class="p-3 border">No. ST</th>
            <th class="p-3 border">Nama Pegawai (Total)</th>
            <th class="p-3 border">Tujuan / Lokasi</th>
            <th class="p-3 border">Tanggal</th>
            <th class="p-3 border">PJ Kegiatan</th>
            <th class="p-3 border">Waktu Input</th>
            <th class="p-3 border">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelPerjadin"></tbody>
      </table>
    </div>
  </div>

  <!-- MODAL KONFIRMASI -->
  <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-60 hidden justify-center items-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 max-w-md w-full text-center">
      <p id="modalText" class="mb-4 font-semibold">Apakah Anda yakin ingin mencetak data ini?</p>
      <div class="flex justify-center gap-4">
        <button id="modalYes" class="bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded transition">Yes</button>
        <button id="modalNo" class="bg-red-500 hover:bg-red-600 text-white font-bold px-4 py-2 rounded transition">No</button>
      </div>
    </div>
  </div>

  <!-- ExcelJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>

  <script>
    const tbody = document.getElementById('tabelPerjadin');
    const loader = document.getElementById('loader');
    const tableContainer = document.getElementById('tabelContainer');
    const confirmModal = document.getElementById('confirmModal');

    // Helper Format Tanggal Indonesia (String Teks Murni)
    const formatDateIndo = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return String(dateStr);
      return d.toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    };

    // Helper Format Angka Ke Rupiah (String Teks Murni - Anti Corrupt XML)
    const formatRupiah = (val) => {
      if (val === null || val === undefined || val === '') return 'Rp 0';
      const num = Number(val);
      if (isNaN(num)) return String(val);
      return 'Rp ' + num.toLocaleString('id-ID');
    };

    const formatDateRange = (start, end) => {
      return `${formatDateIndo(start)} - ${formatDateIndo(end)}`;
    };

    function showConfirmModal(groupData, callback) {
      const mainRow = groupData[0];
      document.getElementById('modalText').innerText = `Anda yakin ingin mencetak data untuk ${groupData.length} pegawai ke ${mainRow.tujuan}?`;
      confirmModal.classList.remove('hidden');

      const yes = document.getElementById('modalYes');
      const no = document.getElementById('modalNo');

      yes.onclick = () => {
        confirmModal.classList.add('hidden');
        callback(true);
      };
      no.onclick = () => {
        confirmModal.classList.add('hidden');
        callback(false);
      };
    }

    // ==========================================
    // EXPORT KE EXCEL
    // ==========================================
    const exportToExcel = async (groupData) => {
      showConfirmModal(groupData, async (isConfirmed) => {
        if (!isConfirmed) return;

        const mainRow = groupData[0];
        const pegawaiList = groupData;

        try {
          const resp = await fetch('/template_pst.xlsx');
          if (!resp.ok) throw new Error(`Template tidak ditemukan: ${resp.status}`);
          const arrayBuffer = await resp.arrayBuffer();

          const workbook = new ExcelJS.Workbook();
          await workbook.xlsx.load(arrayBuffer);

          // ---------------------------------------------------------------------
          // 1. SHEET "Form Perjalanan Dinas"
          // ---------------------------------------------------------------------
          const wsFormPerjadin = workbook.getWorksheet('Form Perjalanan Dinas') || workbook.getWorksheet('Permohonan Perjadin') || workbook.worksheets[1];

          if (wsFormPerjadin) {
            wsFormPerjadin.getCell('H35').value = String(mainRow.pj_kegiatan || '');
            wsFormPerjadin.getCell('E22').value = String(mainRow.tujuan || '');
            wsFormPerjadin.getCell('E23').value = String(mainRow.maksud || '');
            wsFormPerjadin.getCell('E25').value = mainRow.lama_perjalanan ? `${mainRow.lama_perjalanan} ( dua ) hari` : '';
            
            wsFormPerjadin.getCell('E26').value = formatDateIndo(mainRow.tanggal_berangkat);
            wsFormPerjadin.getCell('H26').value = formatDateIndo(mainRow.tanggal_pulang);

            wsFormPerjadin.getCell('H35').value = String(pegawaiList[0]?.nama || '');
            wsFormPerjadin.getCell('E39').value = String(mainRow.mak || '');

            // --- PENAMBAHAN DATA ANGGARAN (E43 & E45) ---
            // Menggunakan format Rupiah berbasis STRING untuk mencegah XML Repair Error
            const anggaranDigunakan = mainRow.rencanabiaya || mainRow.anggaran_digunakan || mainRow.anggaran_digunakan_val || 0;
            const sisaAnggaran = mainRow.sisa_anggaran || mainRow.sisa_anggaran_val || 0;

            wsFormPerjadin.getCell('E43').value = formatRupiah(anggaranDigunakan);
            wsFormPerjadin.getCell('E45').value = formatRupiah(sisaAnggaran);

            // Reset dan isi Tabel Pegawai (Baris 15 s/d 19)
            const START_ROW_P = 15;
            const MAX_ROWS_P = 19;

            for (let r = START_ROW_P; r <= MAX_ROWS_P; r++) {
              wsFormPerjadin.getCell(`B${r}`).value = null;
              wsFormPerjadin.getCell(`C${r}`).value = null;
              wsFormPerjadin.getCell(`E${r}`).value = null;
              wsFormPerjadin.getCell(`H${r}`).value = null;
            }

            pegawaiList.forEach((pegawai, index) => {
              const row = START_ROW_P + index;
              if (row > MAX_ROWS_P) return;

              wsFormPerjadin.getCell(`B${row}`).value = index + 1;
              wsFormPerjadin.getCell(`C${row}`).value = String(pegawai.nama || '');
              wsFormPerjadin.getCell(`F${row}`).value = String(pegawai.jabatan || '');
              wsFormPerjadin.getCell(`I${row}`).value = String(pegawai.golongan || '');
            });
          }

          // ---------------------------------------------------------------------
          // 2. SHEET "Surat Tugas"
          // ---------------------------------------------------------------------
          const wsSuratTugas = workbook.getWorksheet('Surat Tugas') || workbook.worksheets[2];

          if (wsSuratTugas) {
            wsSuratTugas.getCell('E30').value = String(mainRow.maksud || '');
            wsSuratTugas.getCell('E32').value = formatDateIndo(mainRow.tanggal_berangkat);
            wsSuratTugas.getCell('G32').value = formatDateIndo(mainRow.tanggal_pulang);
            wsSuratTugas.getCell('E34').value = String(mainRow.mak || '');

            // Reset dan isi Tabel Pegawai (Baris 22 s/d 27)
            const START_ROW_ST = 22;
            const MAX_ROWS_ST = 27;

            for (let r = START_ROW_ST; r <= MAX_ROWS_ST; r++) {
              wsSuratTugas.getCell(`A${r}`).value = null;
              wsSuratTugas.getCell(`B${r}`).value = null;
              wsSuratTugas.getCell(`E${r}`).value = null;
              wsSuratTugas.getCell(`G${r}`).value = null;
            }

            pegawaiList.forEach((pegawai, index) => {
              const row = START_ROW_ST + index;
              if (row > MAX_ROWS_ST) return;

              wsSuratTugas.getCell(`B${row}`).value = index + 1;
              wsSuratTugas.getCell(`C${row}`).value = String(pegawai.nama || '');
              wsSuratTugas.getCell(`E${row}`).value = String(pegawai.golongan || '');
              wsSuratTugas.getCell(`G${row}`).value = String(pegawai.jabatan || '');
            });
          }

          // ---------------------------------------------------------------------
          // 3. GENERATE DAN UNDUH FILE EXCEL
          // ---------------------------------------------------------------------
          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          });

          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `perjadin_${(mainRow.tujuan || 'data').replace(/\s+/g, '_')}_${mainRow.created_at ? mainRow.created_at.slice(0,10) : ''}.xlsx`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

        } catch (err) {
          console.error('Gagal generate Excel:', err);
          alert('Gagal generate Excel. Silakan periksa console log browser.');
        }
      });
    };

    function groupPerjadinData(data) {
      const grouped = {};
      data.forEach(row => {
        const key = `${row.tujuan}_${row.tanggal_berangkat}_${row.email_user}`;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(row);
      });
      return Object.values(grouped);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const email = localStorage.getItem('loggedInUser') || 'User';
      document.getElementById('userDisplay').textContent = `👤 ${email}`;

      try {
        const res = await fetch('/.netlify/functions/get-perjadin');
        if (!res.ok) throw new Error(`Fetch data gagal: ${res.status}`);
        const allData = await res.json();

        loader.style.display = 'none';
        tableContainer.classList.remove('hidden');

        if (!Array.isArray(allData) || allData.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-gray-500">Belum ada data E-Perjadin.</td></tr>`;
          return;
        }

        const groupedPerjadinData = groupPerjadinData(allData);

        tbody.innerHTML = groupedPerjadinData.map((group, idx) => {
          const mainRow = group[0];
          const namaList = group.map(p => p.nama).join(', ');
          return `
            <tr data-group-index="${idx}">
              <td class="p-2 border font-semibold text-center">${mainRow.id_perjadin}</td>
              <td class="p-2 border font-semibold">${namaList} (${group.length} org)</td>
              <td class="p-2 border">${mainRow.tujuan}</td>
              <td class="p-2 border">${formatDateRange(mainRow.tanggal_berangkat, mainRow.tanggal_pulang)}</td>
              <td class="p-2 border">${mainRow.pj_kegiatan}</td>
              <td class="p-2 border">${new Date(mainRow.created_at).toLocaleString('id-ID')}</td>
              <td class="p-2 border text-center">
                <button class="export-btn text-white bg-green-600 hover:bg-green-700 px-3 py-1 rounded transition" data-index="${idx}">
                  📥 Cetak Excel
                </button>
              </td>
            </tr>
          `;
        }).join('');

        tbody._groupedData = groupedPerjadinData;

        tbody.querySelectorAll('.export-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = Number(e.target.getAttribute('data-index'));
            const groupData = tbody._groupedData[idx];
            exportToExcel(groupData);
          });
        });

      } catch (err) {
        console.error('Error load data:', err);
        loader.style.display = 'none';
        tableContainer.classList.remove('hidden');
        tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-red-500">Kesalahan server saat memuat data.</td></tr>`;
      }
    });
  </script>
</body>
</html>
