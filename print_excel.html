<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cetak E-Perjadin</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="print_excel.css">
</head>
<body class="bg-cover bg-center bg-fixed" style="background-image: url('img/bg_perjadin.jpg');">

  <!-- NAVBAR -->
  <header class="navbar flex justify-between items-center p-4 bg-white bg-opacity-80 shadow-md">
    <div class="flex items-center gap-3">
      <img src="img/Logo-Kementan.png" alt="Logo Kementan" class="h-12">
      <a href="https://perkebunan.brmp.pertanian.go.id/" class="navbar-title text-lg font-bold" target="_blank">
        BRMP PERKEBUNAN
      </a>
    </div>
    <nav class="flex items-center gap-4">
      <span id="userDisplay" class="font-semibold"></span>
      <a href="dashboard.html" class="dashboard-btn text-white bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded transition">⬅️ Dashboard</a>
    </nav>
  </header>

  <!-- HEADER PAGE -->
  <div class="page-header text-center py-8">
    <h1 class="text-2xl font-bold">📋 Cetak Surat Tugas dan Permohonan Perjalanan Dinas</h1>
    <p>Klik tombol "Cetak Excel" pada baris yang ingin dicetak.</p>
  </div>

  <div id="loader" class="loader text-center py-10">Memuat data...</div>

  <!-- TABEL DATA -->
  <div id="tabelContainer" class="hidden px-4">
    <div class="table-wrapper overflow-x-auto">
      <table class="min-w-full border-collapse shadow-lg bg-white bg-opacity-90">
        <thead class="bg-blue-700 text-white">
          <tr>
            <th class="p-3 border">No. ST</th>
            <th class="p-3 border">Nama Pegawai (Total)</th>
            <th class="p-3 border">Tujuan / Lokasi</th>
            <th class="p-3 border">Tanggal</th>
            <th class="p-3 border">PJ Kegiatan</th>
            <th class="p-3 border">Waktu Input</th>
            <th class="p-3 border">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelPerjadin"></tbody>
      </table>
    </div>
  </div>

  <!-- MODAL KONFIRMASI -->
  <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-60 hidden justify-center items-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 max-w-md w-full text-center">
      <p id="modalText" class="mb-4 font-semibold">Apakah Anda yakin ingin mencetak data ini?</p>
      <div class="flex justify-center gap-4">
        <button id="modalYes" class="bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded transition">Yes</button>
        <button id="modalNo" class="bg-red-500 hover:bg-red-600 text-white font-bold px-4 py-2 rounded transition">No</button>
      </div>
    </div>
  </div>

  <!-- ExcelJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>

  <script>
    // =========================
    // Helper + UI variables
    // =========================
    const tbody = document.getElementById('tabelPerjadin');
    const loader = document.getElementById('loader');
    const tableContainer = document.getElementById('tabelContainer');
    const confirmModal = document.getElementById('confirmModal');

    // Format tanggal rentang (DD/MM/YYYY - DD/MM/YYYY)
    const formatDateRange = (start, end) => {
      const dateStart = new Date(start).toLocaleDateString('id-ID');
      const dateEnd = new Date(end).toLocaleDateString('id-ID');
      return `${dateStart} - ${dateEnd}`;
    };

    // =========================
    // Modal Confirm Utility
    // =========================
    function showConfirmModal(groupData, callback) {
      const mainRow = groupData[0];
      document.getElementById('modalText').innerText = `Anda yakin ingin mencetak Surat Tugas & Permohonan Perjadin untuk ${groupData.length} pegawai ke ${mainRow.tujuan}?`;
      confirmModal.classList.remove('hidden');

      const yes = document.getElementById('modalYes');
      const no = document.getElementById('modalNo');

      // Reset handlers untuk menghindari multiple trigger
      yes.onclick = () => {
        confirmModal.classList.add('hidden');
        callback(true);
      };
      no.onclick = () => {
        confirmModal.classList.add('hidden');
        callback(false);
      };
    }

    // ===================================
    // EXPORT KE EXCEL (2 SHEET DALAM 1 FILE)
    // ===================================
    const exportToExcel = async (groupData) => {
      showConfirmModal(groupData, async (isConfirmed) => {
        if (!isConfirmed) return;

        const mainRow = groupData[0];
        const pegawaiList = groupData;

        try {
          // Ambil file template yang memiliki 2 sheet (Surat Tugas & Permohonan Perjadin)
          const resp = await fetch('/template_pst.xlsx');
          if (!resp.ok) throw new Error('File template_pst.xlsx tidak ditemukan');
          
          const arrayBuffer = await resp.arrayBuffer();

          const workbook = new ExcelJS.Workbook();
          await workbook.xlsx.load(arrayBuffer);

          // ----------------------------------------------------
          // AMBIL SHEET BERDASARKAN NAMA DARI TEMPLATE EXCEL
          // ----------------------------------------------------
          // Mengambil Sheet 1 & Sheet 2
          const wsST = workbook.getWorksheet('Surat Tugas') || workbook.worksheets[0];
          const wsPermohonan = workbook.getWorksheet('Permohonan Perjadin') || workbook.worksheets[1];

          // =========================================
          // 1. MEMENGISI SHEET 1 (SURAT TUGAS)
          // =========================================
          if (wsST) {
            wsST.getCell('E24').value = mainRow.tujuan;
            wsST.getCell('E28').value = new Date(mainRow.tanggal_berangkat);
            wsST.getCell('H28').value = new Date(mainRow.tanggal_pulang);
            wsST.getCell('H37').value = mainRow.pj_kegiatan;
            wsST.getCell('E25').value = mainRow.maksud;
            wsST.getCell('O1').value = mainRow.email_user;
            wsST.getCell('O2').value = new Date(mainRow.created_at).toLocaleString('id-ID');
            wsST.getCell('E27').value = mainRow.lama_perjalanan;
            wsST.getCell('F45').value = Number(mainRow.rencanabiaya);

            // Pengisian Tabel Pegawai B14–I22
            const START_ROW_ST = 14;
            const MAX_ROWS_ST = 22;

            // Clear isi slot kosong di template
            for (let r = START_ROW_ST; r <= MAX_ROWS_ST; r++) {
              wsST.getCell(`B${r}`).value = null;
              wsST.getCell(`C${r}`).value = null;
              wsST.getCell(`F${r}`).value = null;
              wsST.getCell(`I${r}`).value = null;
            }

            // Isi daftar pegawai
            pegawaiList.forEach((pegawai, index) => {
              const row = START_ROW_ST + index;
              if (row > MAX_ROWS_ST) return;

              wsST.getCell(`B${row}`).value = index + 1;
              wsST.getCell(`C${row}`).value = pegawai.nama;
              wsST.getCell(`F${row}`).value = pegawai.jabatan;
              wsST.getCell(`I${row}`).value = pegawai.golongan;
            });
          }

          // =========================================
          // 2. MENGISI SHEET 2 (PERMOHONAN PERJADIN)
          // =========================================
          if (wsPermohonan) {
            // Silakan sesuaikan letak Cell dengan template Permohonan milik Anda
            wsPermohonan.getCell('E24').value = mainRow.tujuan;
            wsPermohonan.getCell('E25').value = mainRow.maksud;
            wsPermohonan.getCell('E28').value = new Date(mainRow.tanggal_berangkat);
            wsPermohonan.getCell('H28').value = new Date(mainRow.tanggal_pulang);
            wsPermohonan.getCell('E27').value = mainRow.lama_perjalanan;
            wsPermohonan.getCell('H37').value = mainRow.pj_kegiatan;
            wsPermohonan.getCell('F45').value = Number(mainRow.rencanabiaya);

            // Tabel Pegawai di Sheet Permohonan
            const START_ROW_PERM = 14;
            const MAX_ROWS_PERM = 22;

            for (let r = START_ROW_PERM; r <= MAX_ROWS_PERM; r++) {
              wsPermohonan.getCell(`B${r}`).value = null;
              wsPermohonan.getCell(`C${r}`).value = null;
              wsPermohonan.getCell(`F${r}`).value = null;
              wsPermohonan.getCell(`I${r}`).value = null;
            }

            pegawaiList.forEach((pegawai, index) => {
              const row = START_ROW_PERM + index;
              if (row > MAX_ROWS_PERM) return;

              wsPermohonan.getCell(`B${row}`).value = index + 1;
              wsPermohonan.getCell(`C${row}`).value = pegawai.nama;
              wsPermohonan.getCell(`F${row}`).value = pegawai.jabatan;
              wsPermohonan.getCell(`I${row}`).value = pegawai.golongan;
            });
          }

          // =========================================
          // 3. PROSES DOWNLOAD SINGLE FILE EXCEL
          // =========================================
          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          });

          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `E-Perjadin_${mainRow.tujuan.replace(/\s+/g, '_')}_${mainRow.created_at.slice(0,10)}.xlsx`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

        } catch (err) {
          console.error('Gagal generate Excel:', err);
          alert('Gagal generate Excel. Pastikan file template_pst.xlsx tersedia di server.');
        }
      });
    };

    // ========================================================
    // Group Data berdasarkan tujuan + tanggal + pengaju (email)
    // ========================================================
    function groupPerjadinData(data) {
      const grouped = {};
      data.forEach(row => {
        const key = `${row.tujuan}_${row.tanggal_berangkat}_${row.email_user}`;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(row);
      });
      return Object.values(grouped);
    }

    // =========================
    // Load Data & Render Tabel
    // =========================
    document.addEventListener('DOMContentLoaded', async () => {
      const email = localStorage.getItem('loggedInUser') || 'User';
      document.getElementById('userDisplay').textContent = `👤 ${email}`;

      try {
        const res = await fetch('/.netlify/functions/get-perjadin');
        if (!res.ok) throw new Error(`Fetch data gagal: ${res.status}`);
        const allData = await res.json();

        loader.style.display = 'none';
        tableContainer.classList.remove('hidden');

        if (!Array.isArray(allData) || allData.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-gray-500">Belum ada data E-Perjadin.</td></tr>`;
          return;
        }

        const groupedPerjadinData = groupPerjadinData(allData);

        // Render baris tabel
        tbody.innerHTML = groupedPerjadinData.map((group, idx) => {
          const mainRow = group[0];
          const namaList = group.map(p => p.nama).join(', ');
          return `
            <tr data-group-index="${idx}">
              <td class="p-2 border font-semibold text-center">${mainRow.id_perjadin}</td>
              <td class="p-2 border font-semibold">${namaList} (${group.length} org)</td>
              <td class="p-2 border">${mainRow.tujuan}</td>
              <td class="p-2 border">${formatDateRange(mainRow.tanggal_berangkat, mainRow.tanggal_pulang)}</td>
              <td class="p-2 border">${mainRow.pj_kegiatan}</td>
              <td class="p-2 border">${new Date(mainRow.created_at).toLocaleString('id-ID')}</td>
              <td class="p-2 border text-center">
                <button class="export-btn text-white bg-green-600 hover:bg-green-700 px-3 py-1 rounded transition" data-index="${idx}">
                  📥 Cetak Excel
                </button>
              </td>
            </tr>
          `;
        }).join('');

        // Simpan data di DOM elemen tbody
        tbody._groupedData = groupedPerjadinData;

        // Pasang Event Listener Tombol Cetak
        tbody.querySelectorAll('.export-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = Number(e.target.getAttribute('data-index'));
            const groupData = tbody._groupedData[idx];
            exportToExcel(groupData);
          });
        });

      } catch (err) {
        console.error('Error load data:', err);
        loader.style.display = 'none';
        tableContainer.classList.remove('hidden');
        tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-red-500">Kesalahan server saat memuat data.</td></tr>`;
      }
    });
  </script>
</body>
</html>
